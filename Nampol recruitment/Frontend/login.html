<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NamPol Recruitment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- NAVIGATION -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html"><strong>NamPol</strong> Recruitment</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="status.html">Check Status</a></li>
                <li class="nav-item"><a class="nav-link" href="admin_login.html">Admin</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- LOGIN FORM -->
<div class="container">
    <div class="login-container">
        <h2 class="text-center mb-4">Applicant Login</h2>

        <form id="loginForm">
            <label class="form-label">Email Address</label>
            <input type="email" id="emailInput" class="form-control" required>

            <label class="form-label">Password</label>
            <input type="password" id="passwordInput" class="form-control" required>

            <button type="submit" class="btn btn-login">Login</button>

            <p class="text-center mt-3">
                Don't have an account? <a href="register.html" class="register-link">Register here</a>
            </p>
        </form>
    </div>
</div>

<!-- ============================================================
     FIREBASE LOGIN SCRIPT
     ============================================================ -->
<script type="module">
import { loginUser, getUserData } from '../js/auth.js';
import { addAuditLog } from '../js/firestore.js';

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    
    // Show loading
    submitBtn.textContent = 'Logging in...';
    submitBtn.disabled = true;
    
    // Firebase login
    const result = await loginUser(email, password);
    
    if (result.success) {
        // Get user data
        const userData = await getUserData(result.user.uid);
        const region = userData.success ? userData.data.region : 'Unknown';
        
        // Log the login
        await addAuditLog(
            'USER_LOGIN',
            result.user.uid,
            `Applicant logged in: ${email}`,
            'INFO',
            region
        );
        
        // Redirect to dashboard
        window.location.href = 'dashboard.html';
    } else {
        alert('❌ Login failed:\n\n' + result.error);
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
