<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Applicant Profile | NamPol Recruitment</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .profile-container {
            max-width: 950px;
            margin: 40px auto;
        }

        .profile-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .profile-header {
            background-color: #0b3b6f;
            color: white;
            padding: 25px;
            border-radius: 14px 14px 0 0;
        }

        .section-title {
            color: #0b3b6f;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
        }

        .readonly-field {
            background-color: #e9ecef !important;
        }

        #loadingScreen {
            min-height: 70vh;
        }

        .required::after {
            content: " *";
            color: #dc3545;
        }
    </style>
</head>

<body>

<div
    id="loadingScreen"
    class="d-flex justify-content-center align-items-center"
>
    <div class="text-center">
        <div
            class="spinner-border text-primary mb-3"
            role="status"
        ></div>

        <p>Loading your profile...</p>
    </div>
</div>


<div
    id="profilePage"
    class="container profile-container d-none"
>

    <div class="card profile-card">

        <div class="profile-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                <div>
                    <h2 class="mb-1">Applicant Profile</h2>
                    <p class="mb-0">
                        NamPol E-Recruitment System
                    </p>
                </div>

                <button
                    id="logoutBtn"
                    class="btn btn-outline-light"
                    type="button"
                >
                    Logout
                </button>

            </div>
        </div>


        <div class="card-body p-4 p-md-5">

            <div
                id="alertBox"
                class="alert d-none"
                role="alert"
            ></div>


            <form id="profileForm">

                <!-- PERSONAL INFORMATION -->

                <h5 class="section-title">
                    Personal Information
                </h5>

                <div class="row g-3 mb-4">

                    <div class="col-md-6">
                        <label
                            for="firstName"
                            class="form-label"
                        >
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            class="form-control readonly-field"
                            readonly
                        >
                    </div>


                    <div class="col-md-6">
                        <label
                            for="lastName"
                            class="form-label"
                        >
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            class="form-control readonly-field"
                            readonly
                        >
                    </div>


                    <div class="col-md-6">
                        <label
                            for="idNumber"
                            class="form-label"
                        >
                            Identification Number
                        </label>

                        <input
                            type="text"
                            id="idNumber"
                            class="form-control readonly-field"
                            readonly
                        >
                    </div>


                    <div class="col-md-6">
                        <label
                            for="dateOfBirth"
                            class="form-label"
                        >
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            id="dateOfBirth"
                            class="form-control readonly-field"
                            readonly
                        >
                    </div>


                    <div class="col-md-6">
                        <label
                            for="gender"
                            class="form-label"
                        >
                            Gender
                        </label>

                        <input
                            type="text"
                            id="gender"
                            class="form-control readonly-field"
                            readonly
                        >
                    </div>


                    <div class="col-md-6">
                        <label
                            for="email"
                            class="form-label"
                        >
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control readonly-field"
                            readonly
                        >
                    </div>

                </div>


                <!-- CONTACT INFORMATION -->

                <h5 class="section-title">
                    Contact Information
                </h5>

                <div class="row g-3 mb-4">

                    <div class="col-md-6">

                        <label
                            for="phone"
                            class="form-label required"
                        >
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            required
                            maxlength="20"
                        >

                    </div>


                    <div class="col-md-6">

                        <label
                            for="region"
                            class="form-label required"
                        >
                            Region
                        </label>

                        <select
                            id="region"
                            class="form-select"
                            required
                        >
                            <option value="">
                                Select region
                            </option>

                            <option value="Erongo">Erongo</option>
                            <option value="Hardap">Hardap</option>
                            <option value="Karas">ǁKaras</option>
                            <option value="Kavango East">Kavango East</option>
                            <option value="Kavango West">Kavango West</option>
                            <option value="Khomas">Khomas</option>
                            <option value="Kunene">Kunene</option>
                            <option value="Ohangwena">Ohangwena</option>
                            <option value="Omaheke">Omaheke</option>
                            <option value="Omusati">Omusati</option>
                            <option value="Oshana">Oshana</option>
                            <option value="Oshikoto">Oshikoto</option>
                            <option value="Otjozondjupa">Otjozondjupa</option>
                            <option value="Zambezi">Zambezi</option>
                        </select>

                    </div>


                    <div class="col-12">

                        <label
                            for="address"
                            class="form-label required"
                        >
                            Residential Address
                        </label>

                        <textarea
                            id="address"
                            class="form-control"
                            rows="3"
                            required
                            maxlength="300"
                        ></textarea>

                    </div>

                </div>


                <!-- ADDITIONAL PROFILE INFORMATION -->

                <h5 class="section-title">
                    Additional Information
                </h5>

                <div class="row g-3 mb-4">

                    <div class="col-md-6">

                        <label
                            for="highestQualification"
                            class="form-label required"
                        >
                            Highest Qualification
                        </label>

                        <select
                            id="highestQualification"
                            class="form-select"
                            required
                        >
                            <option value="">
                                Select qualification
                            </option>

                            <option value="Grade 10">
                                Grade 10
                            </option>

                            <option value="Grade 11">
                                Grade 11
                            </option>

                            <option value="Grade 12">
                                Grade 12
                            </option>

                            <option value="Certificate">
                                Certificate
                            </option>

                            <option value="Diploma">
                                Diploma
                            </option>

                            <option value="Bachelor Degree">
                                Bachelor's Degree
                            </option>

                            <option value="Postgraduate">
                                Postgraduate Qualification
                            </option>

                            <option value="Other">
                                Other
                            </option>
                        </select>

                    </div>


                    <div class="col-md-6">

                        <label
                            for="employmentStatus"
                            class="form-label required"
                        >
                            Employment Status
                        </label>

                        <select
                            id="employmentStatus"
                            class="form-select"
                            required
                        >
                            <option value="">
                                Select status
                            </option>

                            <option value="Unemployed">
                                Unemployed
                            </option>

                            <option value="Employed">
                                Employed
                            </option>

                            <option value="Student">
                                Student
                            </option>

                            <option value="Self-employed">
                                Self-employed
                            </option>
                        </select>

                    </div>


                    <div class="col-12">

                        <label
                            for="skills"
                            class="form-label"
                        >
                            Skills
                        </label>

                        <textarea
                            id="skills"
                            class="form-control"
                            rows="3"
                            maxlength="500"
                            placeholder="Example: Computer literacy, communication, driving, first aid"
                        ></textarea>

                        <div class="form-text">
                            Separate multiple skills with commas.
                        </div>

                    </div>

                </div>


                <div class="alert alert-info">
                    Your account information is protected.
                    Your role and account status cannot be changed from this page.
                </div>


                <div class="d-grid gap-2 d-md-flex justify-content-md-end">

                    <button
                        id="saveBtn"
                        type="submit"
                        class="btn btn-primary px-4"
                    >
                        Save and Continue
                    </button>

                </div>

            </form>

        </div>
    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>

<script
    type="module"
    src="../js/profile.js"
></script>

</body>
</html>
