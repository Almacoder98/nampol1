<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NamPol Recruitment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: white;
            padding-top: 80px;
        }
        
        .register-container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .form-control {
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 500;
        }
        
        .btn-register {
            background: #e94560;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
        }
        
        .btn-register:hover {
            background: #c73e54;
        }
        
        .login-link {
            color: #e94560;
            text-decoration: none;
        }
        
        .login-link:hover {
            text-decoration: underline;
        }
        
        .navbar {
            background: rgba(0,0,0,0.8) !important;
        }
        
        .navbar-brand {
            font-weight: bold;
        }
        
        .nav-link {
            color: white !important;
            margin-left: 15px;
        }
        
        .nav-link:hover {
            color: #e94560 !important;
        }
        
        .section-title {
            border-bottom: 2px solid #e94560;
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-top: 30px;
            color: #e94560;
        }
    </style>
</head>
<body>

<!-- NAVIGATION -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html"><strong>NamPol</strong> Recruitment</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="status.html">Check Status</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="register-container">
        <h2 class="text-center mb-4">Create Applicant Account</h2>
        
        <form action="#" method="POST">
            <!-- Personal Information -->
            <h5 class="section-title">Personal Details</h5>
            
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" required>
                </div>
            </div>
            
            <label class="form-label">ID Number / Passport</label>
            <input type="text" class="form-control" required>
            
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Gender</label>
                    <select class="form-control" required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            
            <!-- Contact Information -->
            <h5 class="section-title">Contact Information</h5>
            
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" required>
                </div>
            </div>
            
            <label class="form-label">Physical Address</label>
            <input type="text" class="form-control" required>
            
            <label class="form-label">Region</label>
            <select class="form-control" required>
                <option value="">Select Region</option>
                <option>Khomas</option>
                <option>Ohangwena</option>
                <option>Omusati</option>
                <option>Oshana</option>
                <option>Oshikoto</option>
                <option>Otjozondjupa</option>
                <option>Erongo</option>
                <option>Hardap</option>
                <option>Karas</option>
                <option>Kavango East</option>
                <option>Kavango West</option>
                <option>Zambezi</option>
                <option>Kunene</option>
                <option>Omaheke</option>
                <option>Ompundja</option>
                <option>//Kharas</option>
            </select>
            
            <!-- Account Security -->
            <h5 class="section-title">Account Security</h5>
            
            <div class="row">
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" required>
                </div>
            </div>
            
            <!-- Submit -->
            <button type="submit" class="btn btn-register">Register</button>
            
            <p class="text-center mt-3">
                Already have an account? <a href="login.html" class="login-link">Login here</a>
            </p>
        </form>
    </div>
</div>

<!-- Firebase Integration Script -->
<script type="module">
import { registerUser } from '../js/auth.js';
import { addAuditLog } from '../js/firestore.js';

document.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const form = e.target;
    const inputs = form.querySelectorAll('input');
    const selects = form.querySelectorAll('select');
    
    // Extract form values (matches your HTML structure)
    const firstName = inputs[0].value;
    const lastName = inputs[1].value;
    const idNumber = inputs[2].value;
    const dob = inputs[3].value;
    const gender = selects[0].value;
    const email = inputs[4].value;
    const phone = inputs[5].value;
    const address = inputs[6].value;
    const region = selects[1].value;
    const password = inputs[7].value;
    const confirmPassword = inputs[8].value;
    
    // Validate passwords match
    if (password !== confirmPassword) {
        alert('❌ Passwords do not match!');
        return;
    }
    
    if (password.length < 6) {
        alert('❌ Password must be at least 6 characters!');
        return;
    }
    
    // Show loading
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = 'Creating account...';
    submitBtn.disabled = true;
    
    // Create user data object
    const userData = {
        firstName,
        lastName,
        idNumber,
        dob,
        gender,
        email,
        phone,
        address,
        region
    };
    
    // Register user
    const result = await registerUser(email, password, userData);
    
    if (result.success) {
        // Log the registration
        await addAuditLog(
            'USER_REGISTRATION',
            result.user.uid,
            `New applicant registered: ${firstName} ${lastName} (${email}) in ${region}`,
            'ACTION',
            region
        );
        
        alert('✅ Registration successful!\n\nPlease check your email to verify your account.\n\nYou can now log in.');
        window.location.href = 'login.html';
    } else {
        alert('❌ Registration failed:\n\n' + result.error);
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
